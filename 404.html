<html>
	<head>
		<title>404 Not Found</title>
		<style>
html, body {
	background-color: black;
	color: white;
	font-family: Consolas;
}

h1, h2, p.normal {
	text-align: center;
}

p.corner_bl {
	position: absolute;
	bottom: 0px;
	left: 10px;
	color: black;
}

p.corner_br {
	position: absolute;
	bottom: 0px;
	right: 10px;
	color: black;
}

a:hover {
	color: mediumblue;
}
	</style>
	</head>
	<body>
		<h1>404 Not Found</h1>
		<p class="normal">It seems that you achieved a page which doesn't exist.</p>
		<p class="normal">Go back?</p>
		<p class="normal"><a href="javascript:history.back()">Return to the previous page</a></p>
	</body>
</html>
